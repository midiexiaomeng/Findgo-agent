device: auto
offline: false
warmup_on_start: true
app:
  title: 多模态图像检索
  host: 127.0.0.1
  port: 7860
  open_browser: true
  share: false
  log_level: INFO
paths:
  models_dir: ./models
  data_dir: ./data
  export_dir: ./data/exports
embedding:
  model: chinese-clip-vit-base-patch16
  fallback: OFA-Sys/chinese-clip-vit-base-patch16
  embedding_dim: 512
  normalize: true
  batch_size: 32
  max_text_length: 52
  max_image_side: 1024
  use_fp16: true
  device: auto
  backend: local
  api_base_url: ''
  api_key: ''
  api_model: ''
  api_timeout: 30
vector_store:
  backend: qdrant
  collection: images
  chromadb:
    path: ./data/chromadb
  qdrant:
    mode: local
    path: ./data/qdrant
    url: http://localhost:6333
    api_key: ''
    timeout: 30
caption:
  enabled: true
  model: blip-image-captioning-base
  fallback: Salesforce/blip-image-captioning-base
  batch_size: 8
  max_new_tokens: 40
  beam_size: 3
  cache_db: ./data/captions.sqlite
  max_cache_rows: 50000
  use_fp16: false
  unload_after_index: true
  backend: local
  api_base_url: ''
  api_key: ''
  api_model: ''
  api_timeout: 60
rerank:
  enabled: true
  backend: openai
  model: deepseek-flash
  max_candidates: 16
  batch_size: 4
  max_tokens: 256
  temperature: 0.5
  retries: 1
  ollama:
    base_url: http://localhost:11434
    timeout: 120
  openai:
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 120
  transformers:
    model_path: ./models/Qwen2.5-3B-Instruct
    device: auto
    dtype: float16
    max_input_tokens: 1536
search:
  recall_k: 50
  top_k: 12
  max_all: 1000
  min_score: 0.0
  fusion:
    vector_weight: 0.35
    llm_weight: 0.65
