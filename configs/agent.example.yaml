# 本文件是模板，会随发布包分发。
# 首次使用：复制为 configs/agent.yaml，再填 api_key。
# agent.yaml 已被 .gitignore 和打包脚本排除，不会泄露。

# Agent 层配置：行为、阈值、重试与提示词模板。
# 改动这些无需改代码，重启即生效。

agent:
  max_iterations: 5          # ReAct 循环最大轮次，防止无限循环
  max_retries: 2             # Critic 判定低置信时最多改写 query 重试次数
  similarity_threshold: 0.25 # 平均相似度低于此值判定为低置信
  top_k: 8                   # 检索默认返回数量

llm:
  # 与 retriever 的重排模型相互独立，Agent 决策/总结可单独指定后端
  # openai: 任意 OpenAI 兼容 API（DeepSeek V4 Flash、通义、月之暗面、OpenAI 等）
  # ollama: 本地 Ollama
  backend: openai
  # DeepSeek V4.1 Flash 官方模型名为 deepseek-flash；旧版可用 deepseek-v4-flash
  model: deepseek-flash
  base_url: https://api.deepseek.com/v1
  api_key: ""          # 复制本文件为 agent.yaml 后在此填 Key
  timeout: 120
  # DeepSeek V4 可选推理强度：low / high / max，留空则不传
  reasoning_effort: ""
  # 其他需要透传给 API 的参数
  extra_body: {}

sandbox:
  # 只读素材目录：Agent 只能读，不能改、不能删
  image_roots:
    - ./datasets
  # 可写目录：缓存、向量库、导出、缩略图都在这里
  workspace_roots:
    - ./data

security:
  # 允许 Agent 访问的根目录；留空则默认「项目目录 + 用户主目录」
  # 系统目录（Windows、Program Files、ProgramData）始终禁止
  allowed_roots: []

memory:
  # false: 纯内存，进程退出即丢失（开发调试）
  # true : SQLite 持久化，保存对话与动作轨迹，便于回溯
  persist: true
  db_path: ./data/agent_sessions.sqlite
  # 最多保留多少个历史会话，超出后自动删除最旧的
  max_sessions: 20

prompts:
  system: |
    你是本地图片库的检索助手。你负责理解用户意图，调用检索工具，并校验结果质量。
    只输出 JSON，不要输出任何其他文字。
  react_template: |
    可用工具：
    {tools}

    用户请求：{query}

    请决定下一步动作，输出 JSON：
    - 调用工具：{{"action_type": "tool_call", "tool_name": "image_retrieval", "tool_args": {{"query": "..."}}, "thought": "..."}}
    - 追问用户：{{"action_type": "ask_user", "reply": "请补充..."}}
    - 直接回答：{{"action_type": "answer", "reply": "..."}}
  summarize_template: |
    用户想找：{query}
    系统找到了 {count} 张相关图片。
    请用一句自然、口语化的中文告诉用户结果，像朋友聊天一样。
    不要提召回数量、候选数、精排、耗时等技术细节。
