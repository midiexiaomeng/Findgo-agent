# 工具注册配置（第一层：Agent 能力契约）。
# 新增工具只需在这里登记，Agent 主流程无需改动。

tools:
  - name: image_retrieval
    module: imgsearch_agent.tools.image_retrieval
    class: ImageRetrievalTool
    enabled: true
    description: 用自然语言描述搜索本地图片库，返回图片路径、描述与相似度
    parameters:
      query:
        type: string
        description: 图片内容描述
        required: true
      top_k:
        type: integer
        description: 返回数量
        default: 8
      folder_path:
        type: string
        description: 限定检索的文件夹路径，留空表示全库
        required: false

  - name: image_search_by_image
    module: imgsearch_agent.tools.image_search_by_image
    class: ImageSearchByImageTool
    enabled: true
    description: 以图搜图，给出本地图片路径，返回视觉相似的图片
    parameters:
      image_path:
        type: string
        description: 查询图片路径
        required: true
      top_k:
        type: integer
        description: 返回数量
        default: 8
      folder_path:
        type: string
        description: 限定检索的文件夹路径
        required: false

  - name: index_folder
    module: imgsearch_agent.tools.index_folder
    class: IndexFolderTool
    enabled: true
    description: 对指定文件夹构建图像索引，默认增量更新
    parameters:
      folder_path:
        type: string
        description: 要建索引的文件夹
        required: true
      rebuild:
        type: boolean
        description: True 全量重建，False 增量
        default: false

  - name: get_index_stats
    module: imgsearch_agent.tools.get_index_stats
    class: GetIndexStatsTool
    enabled: true
    description: 查询索引统计，包括图片数量、向量库类型与当前设备
    parameters: {}

  - name: switch_vector_backend
    module: imgsearch_agent.tools.switch_vector_backend
    class: SwitchVectorBackendTool
    enabled: true
    description: 切换向量库后端（chroma / qdrant），切换后需重新索引
    parameters:
      backend_name:
        type: string
        description: chroma 或 qdrant
        required: true

  - name: list_indexed_folders
    module: imgsearch_agent.tools.list_indexed_folders
    class: ListIndexedFoldersTool
    enabled: true
    description: 列出当前索引包含的文件夹及各文件夹图片数量
    parameters:
      limit:
        type: integer
        description: 最多扫描多少条记录
        default: 20000

  - name: describe_image
    module: imgsearch_agent.tools.describe_image
    class: DescribeImageTool
    enabled: true
    description: 给一张本地图片生成中文描述
    parameters:
      image_path:
        type: string
        description: 图片路径
        required: true

  - name: export_results
    module: imgsearch_agent.tools.export_results
    class: ExportResultsTool
    enabled: true
    description: 把检索结果导出成 CSV 或 TXT 清单
    parameters:
      query:
        type: string
        description: 检索描述
        required: true
      top_k:
        type: integer
        description: 导出条数
        default: 20
      folder_path:
        type: string
        description: 限定检索的文件夹路径
        required: false
      output_format:
        type: string
        description: csv 或 txt
        default: csv

  - name: remove_index
    module: imgsearch_agent.tools.remove_index
    class: RemoveIndexTool
    enabled: true
    description: 移除某个文件夹的索引记录，默认只试运行
    parameters:
      folder_path:
        type: string
        description: 要移除索引的文件夹
        required: true
      dry_run:
        type: boolean
        description: True 只统计，False 真正删除
        default: true

  - name: find_duplicates
    module: imgsearch_agent.tools.find_duplicates
    class: FindDuplicatesTool
    enabled: true
    description: 在索引里找出视觉重复的图片，按相似度分组
    parameters:
      folder_path:
        type: string
        description: 只在该文件夹内查找
        required: false
      threshold:
        type: number
        description: 相似度阈值
        default: 0.97
      max_items:
        type: integer
        description: 最多分析多少张
        default: 5000

  - name: trash_manage
    module: imgsearch_agent.tools.trash_manage
    class: TrashManageTool
    enabled: true
    description: 管理暂存区，stage 暂存待删图片、list 查看、restore 恢复、purge 永久删除、cleanup 清理过期
    parameters:
      action:
        type: string
        description: stage / list / restore / purge / cleanup
        required: true
      paths:
        type: array
        description: stage 时的图片路径列表
        required: false
      task_id:
        type: string
        description: 任务 ID
        required: false
      ids:
        type: array
        description: 指定记录 ID
        required: false
      max_days:
        type: integer
        description: cleanup 超时天数
        default: 14
      max_total_gb:
        type: number
        description: cleanup 容量上限 GB
        default: 10

  - name: folder_scan
    module: imgsearch_agent.tools.folder_scan
    class: FolderScanTool
    enabled: true
    description: 扫描本地文件夹，统计图片数量并列出示例路径
    parameters:
      path:
        type: string
        description: 要扫描的文件夹
        required: true
      recursive:
        type: boolean
        description: 是否包含子目录
        default: true

  - name: filter_results
    module: imgsearch_agent.tools.filter_results
    class: FilterResultsTool
    enabled: true
    description: 对已有检索结果做二次过滤，排除暂存图、按分数阈值与关键词筛选
    parameters:
      paths:
        type: array
        description: 上一轮结果的图片路径
        required: true
      exclude_staged:
        type: boolean
        description: 排除已暂存图片
        default: true
      min_similarity:
        type: number
        description: 最低相似度，需要配合 scores
        default: 0
      must_not_keywords:
        type: array
        description: 描述里含这些词则排除
        required: false

  - name: preview_staged
    module: imgsearch_agent.tools.preview_staged
    class: PreviewStagedTool
    enabled: true
    description: 只读查看暂存区待删除图片清单
    parameters:
      task_id:
        type: string
        description: 只看某个任务的记录
        required: false
      limit:
        type: integer
        description: 最多返回条数
        default: 100

  - name: count_indexed_images
    module: imgsearch_agent.tools.count_indexed_images
    class: CountIndexedImagesTool
    enabled: true
    description: 统计索引内图片数量，可对比磁盘数量排查不一致
    parameters:
      folder_path:
        type: string
        description: 只统计该目录，留空统计全库
        required: false

  - name: web_image_search
    module: imgsearch_agent.tools.web_image_search
    class: WebImageSearchTool
    enabled: true
    description: 联网搜索图片并下载到本地缓存，可选自动建索引，用于本地图库不够时补充
    parameters:
      query:
        type: string
        description: 要搜索的图片内容
        required: true
      top_k:
        type: integer
        description: 下载数量
        default: 20
      index:
        type: boolean
        description: 下载后是否立即建索引
        default: true
