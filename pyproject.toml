[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findgo-agent"
version = "0.1.0"
description = "基于 ReAct 的多模态图像检索 Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "requests>=2.28",
    "tqdm>=4.65",
    "pydantic>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    "sentencepiece>=0.1.99",
    "huggingface_hub>=0.20",
    "chromadb>=0.4.22",
    "qdrant-client>=1.7",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.scripts]
findgo-agent = "findgo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# 只保留能真实发现 bug 的规则；风格交给 black
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E501", # 行长由 black 控制
    "F401", # 重新导出会在 __init__ 里用到
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
